name: CI
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.3.0, run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.16.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm verify
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --user 1001
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: organizei,
            POSTGRES_USER: organizei,
            POSTGRES_PASSWORD: organizei_local_only,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U organizei -d organizei"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://organizei:organizei_local_only@postgres:5432/organizei
      BETTER_AUTH_SECRET: synthetic-ci-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with: { version: 11.3.0, run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.16.0, cache: pnpm }
      - name: Install dependencies
        timeout-minutes: 15
        run: time (corepack enable && pnpm install --frozen-lockfile)
      - name: Prepare Database
        run: |
          time pnpm --filter @organizei/database exec tsx -e "
            import { Client } from 'pg';
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            client.connect()
              .then(() => {
                console.log('DB is ready');
                client.end();
              })
              .catch(e => {
                console.error(e);
                process.exit(1);
              });
          "
      - name: Run Migrations
        run: time pnpm db:migrate
      - name: Run Seed
        run: time pnpm db:seed
      - name: Start Application
        env:
          RUNNER_TRACKING_ID: ''
        run: time (pnpm dev &)
      - name: Wait for Application Health Check
        run: |
          time (
            for i in {1..60}; do
              curl -s http://127.0.0.1:3000 && exit 0
              echo "Waiting for app to start..."
              sleep 1
            done
            echo "App failed to start"
            exit 1
          )
      - name: Run Chromium Tests
        timeout-minutes: 15
        run: time pnpm exec playwright test --project=chromium --workers=1
      - name: Run WebKit Tests
        timeout-minutes: 15
        run: time pnpm exec playwright test --project=webkit --workers=1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-artifacts, path: 'test-results/', if-no-files-found: ignore }
