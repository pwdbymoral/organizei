name: CI
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24.16.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm verify
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: organizei,
            POSTGRES_USER: organizei,
            POSTGRES_PASSWORD: organizei_local_only,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U organizei -d organizei"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://organizei:organizei_local_only@localhost:5432/organizei
      BETTER_AUTH_SECRET: synthetic-ci-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24.16.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium webkit && pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: playwright-artifacts, path: 'test-results/', if-no-files-found: ignore }
