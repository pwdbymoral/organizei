name: CI
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 11.3.0, run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.16.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm verify
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: organizei,
            POSTGRES_USER: organizei,
            POSTGRES_PASSWORD: organizei_local_only,
          }
        options: >-
          --health-cmd "pg_isready -U organizei -d organizei"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://organizei:organizei_local_only@127.0.0.1:5432/organizei
      BETTER_AUTH_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_SERVER_LOG: /tmp/server.log
      ORGANIZEI_E2E: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 11.3.0, run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.16.0, cache: pnpm }
      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Generate test auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          corepack enable
          start_time=$(date +%s)
          pnpm install --frozen-lockfile
          end_time=$(date +%s)
          echo "Installation took $((end_time - start_time)) seconds."
      - name: Prepare Playwright
        timeout-minutes: 10
        run: pnpm e2e:setup
      - name: Run E2E suite
        timeout-minutes: 15
        env:
          RUNNER_TRACKING_ID: ''
        run: pnpm exec tsx scripts/ci/run-e2e.ts
      - name: Print Server Log on Failure
        if: failure()
        run: |
          echo "=== Next.js Server Log ==="
          cat /tmp/server.log || echo "No server log found"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-artifacts, path: 'test-results/', if-no-files-found: ignore }
