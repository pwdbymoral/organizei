services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: organizei
      POSTGRES_USER: organizei
      POSTGRES_PASSWORD: organizei_local_only
    ports:
      - '55433:5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U organizei -d organizei]
      interval: 5s
      timeout: 3s
      retries: 20
